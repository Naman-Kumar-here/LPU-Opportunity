{% extends "base.html" %}

{% block title %}
Create Opportunity
{% endblock %}

{% block content %}

<div class="create-opportunity">

    <div class="create-header">

        <p class="small-heading">
            LPU OPPORTUNITIES
        </p>

        <h1>Create Opportunity</h1>

        <p>
            Share an opportunity and find students who are interested in joining.
        </p>

    </div>


    <form method="POST" class="opportunity-form">

        {% csrf_token %}

        <div class="form-group">

            <label for="title">
                Opportunity Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Science Club Recruitment"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe the opportunity..."
            ></textarea>

        </div>

        


        <div class="form-group">

            <label for="category">
                Opportunity Category
            </label>

             <select
                    id="category"
                    name="category"
                    required
            >
                <option value="" disabled selected>
                    Select a category
                </option>

                <option value="hackathon">Hackathon</option>
                <option value="research">Research</option>
                <option value="internship">Internship</option>
                <option value="workshop">Workshop</option>
                <option value="competition">Competition</option>
                <option value="event">Event</option>
                <option value="project">Project</option>
                <option value="club">Club / Society</option>
                <option value="volunteering">Volunteering</option>
                <option value="other">Other</option>

            </select>

        </div>


        <div class="form-group">

            <label for="students_needed">
                Students Needed
            </label>

            <input
                type="number"
                id="students_needed"
                name="students_needed"
                min="1"
                placeholder="e.g. 5"
                required
            >

        </div>


        <div class="form-actions">

            <a
                href="{% url 'home' %}"
                class="btn-back"
            >
                ← Back to Home
            </a>

            <button
                type="submit"
                class="btn-apply"
            >
                Create Opportunity
            </button>

        </div>

    </form>

</div>

{% endblock %}
