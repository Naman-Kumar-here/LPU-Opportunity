{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}

<div class="profile-page">

    <div class="profile-card">

        <p class="small-heading">
            LPU OPPORTUNITIES
        </p>

        <h1>
            🔒 Change Password
        </h1>

        <p class="login-subtitle">
            Update your account password securely.
        </p>


        <form method="POST" onsubmit="disablePasswordButton()">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Current Password
                </label>

                <input
                    type="password"
                    name="old_password"
                    class="form-control"
                    required
                >
            </div>


            <div class="mb-3">
                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    required
                >
            </div>


            <div class="mb-4">
                <label class="form-label">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required
                >
            </div>


            <button
                type="submit"
                class="login-button"
                id="password-button"
            >
                <span>Change Password</span>
                <span>→</span>
            </button>

        </form>

    </div>

</div>


<script>

    function disablePasswordButton() {

        const button = document.getElementById("password-button");

        button.disabled = true;

        button.style.cursor = "not-allowed";

    }

</script>

{% endblock %}
